<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幼兒英語評估工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary:#fff8f0;--bg-card:#fff;--text-primary:#2d3436;--text-secondary:#636e72;
      --coral:#ff6b6b;--pink:#fd79a8;--sky:#74b9ff;--sun:#fdcb6e;--ocean:#00b894;
      --shadow:0 4px 20px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);--radius:20px;--radius-sm:12px;
      font-family:'Quicksand','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg-primary);color:var(--text-primary)}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 20%,rgba(255,107,107,.08),transparent 50%),radial-gradient(circle at 80% 80%,rgba(116,185,255,.08),transparent 50%)}
    #app{max-width:1280px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .top{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:14px}
    .top h1{margin:0;font-family:'Fredoka',sans-serif;font-size:30px;background:linear-gradient(135deg,var(--coral),#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .top p{margin:4px 0 0;color:var(--text-secondary);font-weight:600}
    .tag{border-radius:999px;background:linear-gradient(135deg,rgba(116,185,255,.2),rgba(162,155,254,.2));color:#4a4aa2;padding:8px 14px;font-weight:700}
    .panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:18px;display:grid;gap:14px}
    .hero{text-align:center}.mascot{font-size:68px}
    h2,h3{margin:0;font-family:'Fredoka',sans-serif}
    .muted{color:var(--text-secondary);font-weight:600}
    .field{display:grid;gap:8px}.field label{font-weight:700;color:var(--text-secondary)}
    input{border:3px solid #ffe4a7;border-radius:var(--radius-sm);padding:12px;font-size:18px;outline:none}
    input:focus{border-color:var(--sun);box-shadow:0 0 0 4px rgba(253,203,110,.2)}
    .grid{display:grid;gap:10px}.chips{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.cats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
    .single{grid-template-columns:1fr}.two{grid-template-columns:repeat(2,minmax(220px,1fr))}
    button{border-radius:var(--radius-sm);border:3px solid #edf0f2;background:#fff;color:var(--text-primary);min-height:56px;font-size:17px;font-weight:700;cursor:pointer;padding:10px 12px;transition:.2s}
    button:hover{transform:translateY(-2px)} .active{border-color:var(--sky);background:linear-gradient(135deg,rgba(116,185,255,.18),rgba(162,155,254,.18))}
    .primary{border:none;color:#fff;background:linear-gradient(135deg,var(--coral),var(--pink));box-shadow:0 6px 24px rgba(255,107,107,.35)}
    .primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .cat-card{border-radius:var(--radius);border:3px solid transparent;box-shadow:var(--shadow);display:grid;gap:4px;padding:16px 10px;text-align:center}
    .cat-card .icon{font-size:34px}.cat-card small{color:var(--text-secondary);font-weight:600}
    .cat-card.active{border-color:var(--sky);background:linear-gradient(135deg,rgba(116,185,255,.15),rgba(162,155,254,.15))}
    .row{display:flex;gap:10px;justify-content:space-between}.row>button,.row>div{flex:1}
    .block{border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);padding:14px}
    .big{font-family:'Fredoka',sans-serif;font-size:52px;color:var(--ocean);margin:0}
    .scoregrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
    .scoreitem{border:2px solid #eef3f8;border-radius:12px;padding:10px;display:grid;gap:4px}
    .wrong{border-left:4px solid var(--coral);border-radius:12px;padding:10px;background:#fff}
    .quiz{display:grid;gap:14px;grid-template-columns:1.05fr 1.4fr}
    .qtag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(162,155,254,.2);color:#4a4aa2;font-size:13px;font-weight:700}
    .placeholder{border:2px dashed #d8e3f5;border-radius:12px;padding:10px;display:grid;gap:8px}
    .imgph{min-height:100px;display:flex;align-items:center;justify-content:center;background:#f6fbff;border-radius:10px;color:#6e88a8;font-weight:700}
    .audio{border-color:#b8d7ff;background:linear-gradient(135deg,rgba(116,185,255,.14),rgba(162,155,254,.14));color:#3e5a9a}
    .save-ready{border:2px dashed #b9d8ff}.parent{border:2px dashed #ffd1b8}
    @media (max-width:1024px){.quiz{grid-template-columns:1fr}}
    @media (max-width:900px){.top{flex-direction:column;align-items:flex-start;gap:8px}.row,.two{display:grid;grid-template-columns:1fr}}
  </style>
</head>

const state={stage:'start',profile:{childName:'',ageGroup:'3-4',targetArea:'開學'},questionnaireAnswers:{},testMode:'full',singleCategory:'letters',quizQuestions:[],currentQuestionIndex:0,quizSelections:{},playingQuestionId:null,result:null,completionTime:'',parentName:'',parentPhone:'',followUpHint:'',isSubmitting:false};
const app=document.getElementById('app');
app.addEventListener('click',onClick);app.addEventListener('input',onInput);render();

function onInput(e){const t=e.target;if(t.id==='childName')state.profile.childName=t.value;if(t.id==='parentName')state.parentName=t.value;if(t.id==='parentPhone')state.parentPhone=t.value;render();}
async function onClick(e){const btn=e.target.closest('[data-act]');if(!btn)return;const a=btn.dataset.act;
if(a==='goto'){state.stage=btn.dataset.to;render();}
if(a==='set-age'){state.profile.ageGroup=btn.dataset.value;render();}
if(a==='set-target'){state.profile.targetArea=btn.dataset.value;render();}
if(a==='set-q'){state.questionnaireAnswers[btn.dataset.qid]=btn.dataset.value;render();}
if(a==='set-mode'){state.testMode=btn.dataset.value;render();}
if(a==='set-category'){state.singleCategory=btn.dataset.value;render();}
if(a==='start-quiz'){state.quizQuestions=buildQuizQuestions();state.currentQuestionIndex=0;state.quizSelections={};state.result=null;state.completionTime='';state.saveHint='';state.stage='quiz';render();}
if(a==='choose'){state.quizSelections[btn.dataset.qid]=Number(btn.dataset.idx);render();}
if(a==='prev'){state.currentQuestionIndex=Math.max(0,state.currentQuestionIndex-1);render();}
if(a==='next'){state.currentQuestionIndex=Math.min(state.quizQuestions.length-1,state.currentQuestionIndex+1);render();}
if(a==='finish'){finishQuiz();}
if(a==='audio'){const q=state.quizQuestions[state.currentQuestionIndex];if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.audioLabel);u.lang='en-US';u.rate=0.85;state.playingQuestionId=q.id;render();u.onend=()=>{state.playingQuestionId=null;render();};u.onerror=()=>{state.playingQuestionId=null;render();};window.speechSynthesis.speak(u);}else{state.playingQuestionId=q.id;render();setTimeout(()=>{if(state.playingQuestionId===q.id){state.playingQuestionId=null;render();}},1500);}}
if(a==='retake'){state.stage='mode';state.quizQuestions=[];state.currentQuestionIndex=0;state.quizSelections={};state.result=null;state.completionTime='';state.followUpHint='';state.isSubmitting=false;render();}
if(a==='home'){resetAll();render();}
if(a==='finalize-followup'){await handleFinalizeFollowUp();}
}

function resetAll(){state.stage='start';state.profile={childName:'',ageGroup:'3-4',targetArea:'開學'};state.questionnaireAnswers={};state.testMode='full';state.singleCategory='letters';state.quizQuestions=[];state.currentQuestionIndex=0;state.quizSelections={};state.playingQuestionId=null;state.result=null;state.completionTime='';state.parentName='';state.parentPhone='';state.followUpHint='';state.isSubmitting=false;}
function canProfile(){return state.profile.childName.trim().length>0}
function canQuestionnaire(){return QUESTIONNAIRE.every(q=>state.questionnaireAnswers[q.id])}

function buildQuizQuestions(){if(state.testMode==='single')return [...QB[state.profile.ageGroup][state.singleCategory]];return CATEGORIES.flatMap(c=>QB[state.profile.ageGroup][c]);}
function finishQuiz(){const attempts=state.quizQuestions.map(q=>({questionId:q.id,selectedIndex:state.quizSelections[q.id],isCorrect:state.quizSelections[q.id]===q.correctIndex}));state.result=calculateResult(state.quizQuestions,attempts);state.completionTime=new Date().toISOString();state.stage='result';render();}
function calculateResult(questions,attempts){const map=new Map(attempts.map(a=>[a.questionId,a]));const scores=Object.fromEntries(CATEGORIES.map(c=>[c,{correct:0,total:0,percentage:0}]));const wrong=[];
for(const q of questions){const a=map.get(q.id);if(!a)continue;scores[q.category].total++;if(a.isCorrect)scores[q.category].correct++;else wrong.push({question:q,selectedIndex:a.selectedIndex});}
let totalCorrect=0,totalQuestions=0;for(const c of CATEGORIES){const r=scores[c];totalCorrect+=r.correct;totalQuestions+=r.total;r.percentage=r.total?Math.round(r.correct/r.total*100):0;}
const totalPercentage=totalQuestions?Math.round(totalCorrect/totalQuestions*100):0;const level=totalPercentage<=49?'Level 1':totalPercentage<=69?'Level 2':totalPercentage<=84?'Level 3':'Level 4';
const weakestCategory=CATEGORIES.reduce((w,c)=>{const ws=scores[w],cs=scores[c];if(!cs.total)return w;if(!ws.total)return c;return cs.percentage<ws.percentage?c:w;},CATEGORIES[0]);
return{totalCorrect,totalQuestions,totalPercentage,level,categoryScores:scores,wrongQuestions:wrong,weakestCategory};
}

function buildRecommendations(){const r=state.result;const weak=state.result.weakestCategory;const weakRules={letters:['Cambridge 認字記憶班','親子英文故事班'],picture:['Cambridge 認字記憶班','親子英文故事班'],phonics:['家長英語拼音基礎課','Phonics拼讀之旅'],blend:['Phonics拼讀之旅','家長英語拼音基礎課'],dictation:['親子英語寫作班','家長英語拼音基礎課']};
let main='',secondary='';if(state.profile.targetArea==='開學'){main=(state.profile.ageGroup==='1-2'||state.profile.ageGroup==='3-4')?'升K相關課程':'升小相關課程';}
if(state.profile.targetArea==='學習記憶'){main='Cambridge 認字記憶班';secondary='兒童高效記憶家長課';}
if(state.profile.targetArea==='專注力'){if(state.profile.ageGroup==='1-2'){main='1-3歲學前專注力基礎課';secondary='3-6歲專注力提升手冊';}else{main='3-6歲專注力基礎課程';secondary='3-6歲專注力提升手冊';}}
if(!secondary)secondary=(weakRules[weak][0]!==main)?weakRules[weak][0]:weakRules[weak][1];
const supplementary=[];if(r.totalPercentage>=85)supplementary.push('親子英文故事班','Phonics拼讀之旅');
return{mainRecommendation:main,secondaryRecommendation:secondary,supplementaryRecommendations:supplementary,reasons:[`本次分流方向為「${state.profile.targetArea}」，主推薦「${main}」，可先對齊目前學習目標。`,`英文較弱環節為「${CATEGORY_LABELS[weak]}」，建議以「${secondary}」作補強，循序提升孩子信心。`]};
}

function buildParentAdvice(){const r=state.result;const byLevel={'Level 1':'建議先以短時間、高頻率方式建立英文接觸感，每次練習 10 分鐘左右最合適。','Level 2':'孩子基礎正在建立中，建議固定每週 3 至 4 次練習，持續累積穩定感。','Level 3':'孩子已具備同齡基礎，可在保持興趣下加入小挑戰，讓學習更有成就感。','Level 4':'孩子整體表現突出，可安排進階活動，同時保留遊戲化互動以維持學習熱情。'};
const byTarget={開學:'配合開學節奏，建議把練習放在固定作息時段，幫助孩子更快進入學習狀態。',學習記憶:'可加入圖像記憶與口語複述，提升孩子記住單字與句型的效率。',專注力:'建議採用短回合互動任務，先穩定專注時間，再逐步延長學習耐力。'};
return `${byLevel[r.level]} ${byTarget[state.profile.targetArea]} 目前較需加強「${CATEGORY_LABELS[r.weakestCategory]}」，可透過看圖配對、跟讀及簡單拼讀遊戲，讓孩子在輕鬆互動中穩步進步。`;}

function buildAi(){const r=state.result;const name=state.profile.childName.trim()||'孩子';const top=CATEGORIES.reduce((b,c)=>r.categoryScores[c].percentage>r.categoryScores[b].percentage?c:b,'letters');const tone={'Level 1':'願意完成評估、認真聆聽和作答，已經是很好的起步，值得鼓勵。','Level 2':'已有初步基礎，持續規律練習之下，進步幅度會愈來愈明顯。','Level 3':'理解與反應能力不錯，整體表現符合同齡水平，方向正確。','Level 4':'整體表現高於同齡，已具備良好的英文學習底子，可以嘗試更多挑戰。'};const targetHints={開學:'配合開學準備，建議把英語練習放入固定作息時段，讓孩子對學習節奏感到熟悉。',學習記憶:'針對記憶目標，可多用圖像聯想與口語複述，讓孩子在有趣的情境中反覆接觸詞彙。',專注力:'針對專注力目標，建議採用短回合任務，先穩定投入感，再慢慢延長每次練習時間。'};
return `${name}今次評估總分為 ${r.totalPercentage}%，整體評級為${r.level}。${tone[r.level]} 今次在「${CATEGORY_LABELS[top]}」的表現較為穩定，反映${name}已有可延伸的學習基礎，這個優勢可以在日後的學習中繼續發揮。下一步建議優先加強「${CATEGORY_LABELS[r.weakestCategory]}」，每天以 10 至 15 分鐘進行聽音、看圖與親子互動遊戲，循序漸進地幫助孩子建立信心。${targetHints[state.profile.targetArea]} 整體而言，${name}的表現值得肯定，只要持續以鼓勵代替壓力，讓學習融入日常生活，孩子的英文自信自然會慢慢建立起來。`;}

function buildSavePayload(){if(!state.result||!state.completionTime)return null;const rec=buildRecommendations();const parentAdvice=buildParentAdvice();const ai=buildAi();
const categoryScores=Object.fromEntries(CATEGORIES.map(c=>[c,state.result.categoryScores[c].percentage]));
return{childName:state.profile.childName,ageGroup:state.profile.ageGroup,targetArea:state.profile.targetArea,questionnaireAnswers:state.questionnaireAnswers,categoryScores,totalScorePercentage:state.result.totalPercentage,level:state.result.level,parentAdvice,aiAnalysisText:ai,recommendedCourses:{main:rec.mainRecommendation,secondary:rec.secondaryRecommendation,supplementary:rec.supplementaryRecommendations},recommendationReasons:rec.reasons,parentInfo:{parentName:state.parentName,parentPhone:state.parentPhone},completedAt:state.completionTime};}

async function handleFinalizeFollowUp(){
  const payload=buildSavePayload();
  if(!payload)return;
  state.isSubmitting=true;
  state.followUpHint='資料傳送中，請稍候...';
  render();
  try{
    const response=await fetch(API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${API_KEY}`,
      },
      body:JSON.stringify(payload),
    });
    if(!response.ok)throw new Error(`API request failed with status ${response.status}`);
    state.followUpHint='✅ 評估結果與跟進資料已成功送出！';
  }catch(error){
    console.error('Failed to submit follow-up payload:',error);
    state.followUpHint='❌ 資料送出失敗，請檢查網路連線或稍後再試。';
  }finally{
    state.isSubmitting=false;
    render();
  }
}

function render(){app.innerHTML=`<header class="top"><div><h1>幼兒英語評估工具</h1><p>Xaris Academy / 恩道教育</p></div><div class="tag">iPad 橫向流程版</div></header>${screen()}`;}

function screen(){
if(state.stage==='start')return `<section class="panel hero"><div class="mascot">📚</div><h2>幼兒英文能力評估</h2><p class="muted">完成分流問卷與測驗後，即場查看結果、建議與課程方向。</p><button class="primary" data-act="goto" data-to="questionnaire_profile">開始問卷</button></section>`;
if(state.stage==='questionnaire_profile')return `<section class="panel"><h2>分流問卷（1/2）</h2><div class="field"><label>小朋友名字</label><input id="childName" value="${esc(state.profile.childName)}" placeholder="請輸入小朋友名字"></div><div class="field"><label>1. 小朋友年齡</label><div class="grid chips">${AGE_GROUPS.map(a=>`<button data-act="set-age" data-value="${a}" class="${state.profile.ageGroup===a?'active':''}">${a}</button>`).join('')}</div></div><div class="field"><label>2. 你而家最想針對小朋友加強邊一方面？</label><div class="grid chips">${TARGET_AREAS.map(t=>`<button data-act="set-target" data-value="${t}" class="${state.profile.targetArea===t?'active':''}">${t}</button>`).join('')}</div></div><div class="row"><button class="ghost" data-act="home">回首頁</button><button class="primary" data-act="goto" data-to="questionnaire_detail" ${canProfile()?'':'disabled'}>下一步：英文背景問卷</button></div></section>`;
if(state.stage==='questionnaire_detail')return `<section class="panel"><h2>英文背景問卷（2/2）</h2>${QUESTIONNAIRE.map((q,i)=>`<div class="block"><h3>${i+1}. ${q.text}</h3><div class="grid opts">${q.options.map(o=>`<button data-act="set-q" data-qid="${q.id}" data-value="${o}" class="${state.questionnaireAnswers[q.id]===o?'active':''}">${o}</button>`).join('')}</div></div>`).join('')}<div class="row"><button class="ghost" data-act="goto" data-to="questionnaire_profile">上一步</button><button class="primary" data-act="goto" data-to="mode" ${canQuestionnaire()?'':'disabled'}>下一步：選擇測驗模式</button></div></section>`;
if(state.stage==='mode')return `<section class="panel"><h2>測驗模式</h2><div class="grid opts" style="grid-template-columns:repeat(2,minmax(220px,1fr))"><button data-act="set-mode" data-value="single" class="${state.testMode==='single'?'active':''}">單類測驗（single）</button><button data-act="set-mode" data-value="full" class="${state.testMode==='full'?'active':''}">綜合測驗（full）</button></div>${state.testMode==='single'?`<div class="field"><label>請選擇單類測驗類別</label><div class="grid cats">${CATEGORIES.map(c=>`<button data-act="set-category" data-value="${c}" class="cat-card ${state.singleCategory===c?'active':''}"><span class="icon">${CATEGORY_UI[c].icon}</span><strong>${CATEGORY_UI[c].title}</strong><small>${CATEGORY_UI[c].desc}</small></button>`).join('')}</div></div>`:''}<div class="block muted">題庫來源：${state.profile.ageGroup} 年齡層。${state.testMode==='full'?'將覆蓋多個類別能力。':'只測所選單一類別。'}</div><div class="row"><button class="ghost" data-act="goto" data-to="questionnaire_detail">上一步</button><button class="primary" data-act="start-quiz">開始作答</button></div></section>`;
if(state.stage==='quiz'){const q=state.quizQuestions[state.currentQuestionIndex];const sel=state.quizSelections[q.id];return `<section class="panel"><h2>評估作答中</h2><p class="muted">第 ${state.currentQuestionIndex+1} / ${state.quizQuestions.length} 題 - 類別：${CATEGORY_LABELS[q.category]}</p><div class="block quiz"><div><h3>${q.questionText}</h3><span class="qtag">${q.questionType==='listen'?'聽音題':'看圖題'}</span>${q.questionType==='listen'?`<div class="placeholder"><p class="muted">音訊標記：${q.audioLabel}</p><button class="audio" data-act="audio">${state.playingQuestionId===q.id?'播放中...':'播放音訊'}</button></div>`:`<div class="placeholder">${IMAGE_MAP[q.imageLabel]?`<img src="${IMAGE_MAP[q.imageLabel]}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px" alt="${q.imageLabel}">`:`<div class="imgph">${q.imageLabel}</div>`}</div>`}</div><div class="grid opts single">${q.options.map((o,i)=>`<button data-act="choose" data-qid="${q.id}" data-idx="${i}" class="${sel===i?'active':''}">${o}</button>`).join('')}</div></div><div class="row"><button class="ghost" data-act="prev" ${state.currentQuestionIndex===0?'disabled':''}>上一題</button>${state.currentQuestionIndex<state.quizQuestions.length-1?`<button class="primary" data-act="next" ${typeof sel==='number'?'':'disabled'}>下一題</button>`:`<button class="primary" data-act="finish" ${typeof sel==='number'?'':'disabled'}>完成評估</button>`}</div></section>`;}
if(state.stage==='result'){const r=state.result,rec=buildRecommendations(),advice=buildParentAdvice(),ai=buildAi();const tested=CATEGORIES.filter(c=>r.categoryScores[c].total>0);return `<section class="panel"><h2>評估結果</h2><div class="block"><h3>1. 總分 %</h3><p class="big">${r.totalPercentage}%</p></div><div class="block"><h3>2. 四級評級</h3><p>${LEVEL_LABELS[r.level]}</p></div><div class="block"><h3>3. 各類別分數</h3><div class="scoregrid">${tested.map(c=>`<div class="scoreitem"><strong>${CATEGORY_LABELS[c]}</strong><span>${r.categoryScores[c].percentage}% (${r.categoryScores[c].correct}/${r.categoryScores[c].total})</span></div>`).join('')}</div>${state.testMode==='single'?`<p class="muted">此結果為單類測驗分數。</p>`:''}</div><div class="block"><h3>4. 錯題區</h3>${r.wrongQuestions.length?r.wrongQuestions.map((w,i)=>`<div class="wrong">${i+1}. [${CATEGORY_LABELS[w.question.category]}] ${w.question.questionText}<br>你的答案：${w.question.options[w.selectedIndex]}<br>正確答案：${w.question.options[w.question.correctIndex]}</div>`).join(''):'<p>沒有錯題，表現很棒。</p>'}</div><div class="block"><h3>5. 家長建議</h3><p>${advice}</p></div><div class="block"><h3>6. AI 分析</h3><p>${ai}</p></div><div class="block"><h3>7. 推薦課程</h3><p>主推薦：${rec.mainRecommendation}</p><p>次推薦：${rec.secondaryRecommendation}</p>${rec.supplementaryRecommendations.length?`<p>高表現補充：${rec.supplementaryRecommendations.join('、')}</p>`:''}</div><div class="block"><h3>8. 推薦課程原因</h3><p>${rec.reasons[0]}</p><p>${rec.reasons[1]}</p></div><div class="block row"><div><h3>9. 再測一次</h3><button class="primary" data-act="retake">再測一次</button></div><div><h3>10. 回首頁</h3><button class="ghost" data-act="home">回首頁</button></div></div><div class="block parent"><h3>現場跟進資料（可跳過）</h3><p class="muted">如需後續跟進建議，可留下聯絡資料。</p><div class="grid two"><div class="field"><label>家長姓名</label><input id="parentName" value="${esc(state.parentName)}" placeholder="可留空"></div><div class="field"><label>家長電話</label><input id="parentPhone" value="${esc(state.parentPhone)}" placeholder="可留空"></div></div><div class="row" style="margin-top:10px"><button class="ghost" data-act="finalize-followup" ${state.isSubmitting?'disabled':''}>${state.isSubmitting?'傳送中...':'完成跟進資料整理'}</button></div>${state.followUpHint?`<p class="muted">${state.followUpHint}</p>`:''}</div></section>`;}
return '';
}

function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
</script>
</body>
</html>
